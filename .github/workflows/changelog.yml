name: Changelog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    # evita loop infinito quando o próprio workflow commita o CHANGELOG.md
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Calcular próxima versão
        id: version
        run: echo "tag=$(git-cliff --bumped-version)" >> "$GITHUB_OUTPUT"

      - name: Gerar CHANGELOG.md
        run: git-cliff --bump --output CHANGELOG.md
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar tag e commitar CHANGELOG.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: atualiza CHANGELOG.md para ${{ steps.version.outputs.tag }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push
          git push --tags
